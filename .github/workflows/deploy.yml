name: Deploy

on:
  push:
    branches: [main, stage, develop]

env: 
  Project: ${{ vars.PROJECT }}
  DistributionId: ${{ vars.CLOUDFRONT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract Branch Name
        shell: bash
        run: echo "Stage=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV


      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: 'us-east-1'

      - uses: aws-actions/setup-sam@v2

      - name: Install dependencies
        run: |
          npm install
          npm install -g esbuild
      
      - name: Type check and lint
        run: |
          npx tsc --noEmit
          npm run lint

      - name: Set Overrides
        shell: bash
        run: |
          chmod +x ./parameter-overrides/print.sh
          chmod +x ./parameter-overrides/set.sh
          ./parameter-overrides/set.sh
          ./parameter-overrides/print.sh
        env:
          Project: ${{ vars.PROJECT }}
          EncryptSecret: ${{ secrets.ENCRYPT_SECRET }}
          BasicAuthSecret: ${{ secrets.BASIC_AUTH_SECRET }}
          RecaptchaEnabled: ${{ vars.RECAPTCHA_ENABLED }}
          RecaptchaSecret: ${{ secrets.RECAPTCHA_SECRET }}
          
      - name: SAM Build
        run: sam build

      - name: SAM Deploy
        run: |
          sam deploy \
            --config-env ${{ github.ref_name }} \
            --parameter-overrides $(./parameter-overrides/print.sh) \
            --debug \
          || [ $? -eq 1 ] && echo "No changes to deploy, continuing..."
        env:
          Project: ${{ vars.PROJECT }}
          EncryptSecret: ${{ secrets.ENCRYPT_SECRET }}
          BasicAuthSecret: ${{ secrets.BASIC_AUTH_SECRET }}
          RecaptchaEnabled: ${{ vars.RECAPTCHA_ENABLED }}
          RecaptchaSecret: ${{ secrets.RECAPTCHA_SECRET }}
      
      - name: Invalidate Cloudfront
        run: |
          aws cloudfront create-invalidation --distribution-id $DistributionId --paths "/*"