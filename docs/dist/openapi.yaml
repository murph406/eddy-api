openapi: 3.1.0

info:
  title: Eddy API
  version: 1.0.0

paths:
  /api/v1:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
                
components:
  schemas:
    HealthResponse:
      type: object
      required: [success, timestamp, dataYear, data]
      properties:
        success: { const: true }
        timestamp: { type: string, format: date-time }
        dataYear: { type: string }
        data:
          type: object
          required: [status]
          properties:
            status: { type: string }
            stage: { type: string }