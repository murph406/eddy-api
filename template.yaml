AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Eddy Api Gateway

Parameters:
  Project:
    Type: String
  Stage:
    Type: String
    AllowedValues:
      - develop
      - stage
      - main
    Description: develop, stage or main
  BasicAuthSecret:
    Type: String
  EncryptSecret:
    Type: String
  RecaptchaEnabled:
    Type: String
  RecaptchaSecret:
    Type: String
  OllamaUrl:
    Type: String

Globals:
  Function:
    CodeUri: ./
    Runtime: nodejs24.x
    Timeout: 900
    MemorySize: 256
    Environment:
      Variables:
        STAGE: !Ref Stage
        PROJECT: !Ref Project
        BASIC_AUTH_SECRET: !Ref BasicAuthSecret
        ENCRYPT_SECRET: !Ref EncryptSecret
        RECAPTCHA_ENABLED: !Ref RecaptchaEnabled
        RECAPTCHA_SECRET: !Ref RecaptchaSecret
        OLLAMA_URL: !Ref OllamaUrl
        OLLAMA_API_KEY_PARAM: !Sub /eddy/${Stage}/ollama-api-key

Resources:
  ReadEddyParametersPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Lets the API Lambdas read secrets from Parameter Store
    Properties:
      ManagedPolicyName: !Sub '${Project}-${Stage}-read-parameters'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/eddy/${Stage}/*

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Execution role for the API Lambdas.
    Properties:
      RoleName: !Sub '${Project}-${Stage}-api-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref ReadEddyParametersPolicy

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: Logs for the health function.
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Project}-${Stage}-HealthFunction'
      RetentionInDays: 14

  EddyApi:
    Type: AWS::Serverless::Api
    Metadata:
      com.aws.cloudformation.Context:
        why: Public REST API for the Eddy mobile app.
    Properties:
      Name: !Sub '${Project}-${Stage}-api'
      StageName: !Ref Stage
  
  HealthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2020
        Sourcemap: true
        Minify: false
        EntryPoints:
          - src/controllers/health/index.ts
      com.aws.cloudformation.Context:
        why: Health check endpoint for the API.
    Properties:
      Role: !GetAtt LambdaExecutionRole.Arn
      FunctionName: !Sub '${Project}-${Stage}-HealthFunction'
      Handler: controllers/health/index.handler
      Events:
        api:
          Type: Api
          Properties:
            Path: /api/v1
            Method: GET
            RestApiId: !Ref EddyApi

  ChatFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2020
        Sourcemap: true
        Minify: false
        EntryPoints:
          - src/controllers/chat/index.ts
        com.aws.cloudformation.Context:
          why: Eddy chat endpoint. Calls the self-hosted Ollama model through the auth proxy.
    Properties:
      Role: !GetAtt LambdaExecutionRole.Arn
      FunctionName: !Sub '${Project}-${Stage}-ChatFunction'
      Handler: controllers/chat/index.handler
      Events:
        api:
          Type: Api
          Properties:
            Path: /api/v1/chat
            Method: GET
            RestApiId: !Ref EddyApi